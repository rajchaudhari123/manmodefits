<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #f953c6 0%, #b91d73 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .countdown-container {
            text-align: center;
            color: white;
            padding: 40px 30px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            max-width: 800px;
            width: 90%;
        }

        .countdown-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .countdown-subtitle {
            font-size: 1.3rem;
            margin-bottom: 40px;
            color: rgba(255, 255, 255, 0.9);
        }

        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            min-width: 120px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .countdown-item:hover { transform: translateY(-5px); }

        .countdown-value {
            font-size: 3rem;
            font-weight: 700;
            display: block;
            color: #ffb3d9;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .countdown-label {
            font-size: 1rem;
            margin-top: 5px;
            color: rgba(255, 255, 255, 0.85);
        }

        .enter-btn {
            padding: 15px 50px;
            background: linear-gradient(45deg, #ff69b4, #ff9ed2);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
            position: relative;
            overflow: hidden;
            opacity: 0.5;
            pointer-events: none;
        }

        .enter-btn.active {
            opacity: 1;
            pointer-events: auto;
        }

        .enter-btn.active:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.7);
        }

        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }

        .enter-btn.active:hover::before { left: 100%; }

        .floating-hearts {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        .heart {
            position: absolute;
            color: rgba(255, 182, 217, 0.8);
            animation: float-up 10s linear infinite;
        }

        @keyframes float-up {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .access-info {
            margin-top: 25px;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.85);
        }

        .access-info i { color: #ffb3d9; margin-right: 8px; }

        .message {
            margin-top: 18px;
            font-style: italic;
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .countdown-title { font-size: 2.5rem; }
            .countdown-timer { gap: 10px; }
            .countdown-item { min-width: 80px; padding: 15px; }
            .countdown-value { font-size: 2rem; }
            .enter-btn { padding: 12px 40px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="countdown-container">
        <h1 class="countdown-title">Birthday Surprise 💕</h1>
        <p class="countdown-subtitle">Your special gift unlocks at midnight tonight!</p>

        <div class="countdown-timer">
            <div class="countdown-item">
                <span class="countdown-value" id="hours">00</span>
                <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-value" id="minutes">00</span>
                <span class="countdown-label">Minutes</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-value" id="seconds">00</span>
                <span class="countdown-label">Seconds</span>
            </div>
        </div>

        <button class="enter-btn" id="enterBtn">
            <i class="fas fa-lock"></i> Enter Website
        </button>

        <div class="access-info">
            <p><i class="fas fa-heart"></i> Something magical is waiting for you at midnight 🌙</p>
        </div>

        <p class="message">Get ready for a birthday you will never forget! 💖</p>
    </div>

    <script>
        // Floating Hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = Math.random() * 3 + 7 + 's';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.getElementById('floatingHearts').appendChild(heart);
            setTimeout(() => heart.remove(), 10000);
        }
        setInterval(createHeart, 500);

        // Countdown to midnight tonight
        function getMidnightTonight() {
            const now = new Date();
            const midnight = new Date(now);
            midnight.setHours(24, 0, 0, 0); // next midnight
            return midnight.getTime();
        }

        const endTime = getMidnightTonight();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = endTime - now;

            if (distance <= 0) {
                clearInterval(countdownInterval);
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';

                const enterBtn = document.getElementById('enterBtn');
                enterBtn.classList.add('active');
                enterBtn.innerHTML = '<i class="fas fa-unlock"></i> Enter Website 💕';
                return;
            }

            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('hours').textContent = hours < 10 ? '0' + hours : hours;
            document.getElementById('minutes').textContent = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('seconds').textContent = seconds < 10 ? '0' + seconds : seconds;
        }

        const countdownInterval = setInterval(updateCountdown, 1000);
        updateCountdown();

        // Enter button
        document.getElementById('enterBtn').addEventListener('click', function() {
            if (this.classList.contains('active')) {
                window.location.href = 'birthday.html';
            }
        });
    </script>
</body>
</html>
