<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body { font-family: Arial; background:#f4f4f4; }
        .login, .dashboard { max-width: 900px; margin: auto; padding: 20px; }
        .card { background:white; padding:15px; margin:10px 0; border-radius:10px; }
        input, select { padding:8px; margin:5px; }
        button { padding:8px 12px; cursor:pointer; }
        .hidden { display:none; }
    </style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div class="login" id="loginBox">
    <h2>Admin Login</h2>
    <input type="email" id="adminEmail" placeholder="Email"><br>
    <input type="password" id="adminPass" placeholder="Password"><br>
    <button onclick="login()">Login</button>
</div>

<!-- 📊 DASHBOARD -->
<div class="dashboard hidden" id="dashboard">

    <h1>📦 Admin Dashboard</h1>

    <button onclick="logout()">Logout</button>

    <br><br>

    <!-- 🔍 SEARCH + FILTER -->
    <input type="text" id="search" placeholder="Search by name..." onkeyup="renderOrders()">

    <select id="filter" onchange="renderOrders()">
        <option value="all">All</option>
        <option value="pending">Pending</option>
        <option value="paid">Paid</option>
        <option value="COD">COD</option>
        <option value="Prepaid">Prepaid</option>
    </select>

    <div id="orders"></div>
</div>

<!-- Firebase -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/7.14.1-0/firebase.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC1T6859x4g0rRlYgQBzeQ24SdpWgQrpMQ",
  authDomain: "manmodefits.firebaseapp.com",
  databaseURL: "https://manmodefits-default-rtdb.firebaseio.com",
  projectId: "manmodefits"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let allOrders = [];

/* 🔐 LOGIN */
function login() {
    let email = document.getElementById("adminEmail").value;
    let pass = document.getElementById("adminPass").value;

    auth.signInWithEmailAndPassword(email, pass)
    .then(() => {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        loadOrders();
    })
    .catch(err => alert(err.message));
}

/* 🔓 LOGOUT */
function logout() {
    auth.signOut();
    location.reload();
}

/* 📥 LOAD ORDERS */
function loadOrders() {
    db.ref("orders").on("value", snapshot => {
        allOrders = [];
        snapshot.forEach(child => {
            allOrders.push({
                id: child.key,
                ...child.val()
            });
        });
        renderOrders();
    });
}

/* 🔍 FILTER + SEARCH */
function renderOrders() {
    let container = document.getElementById("orders");
    let search = document.getElementById("search").value.toLowerCase();
    let filter = document.getElementById("filter").value;

    container.innerHTML = "";

    let filtered = allOrders.filter(o => {
        let matchSearch = o.customer_name.toLowerCase().includes(search);

        let matchFilter =
            filter === "all" ||
            o.status === filter ||
            o.payment_method === filter;

        return matchSearch && matchFilter;
    });

    if (filtered.length === 0) {
        container.innerHTML = "<p>No orders found</p>";
        return;
    }

    filtered.reverse().forEach(order => {

        let div = document.createElement("div");
        div.className = "card";

        let itemsHTML = "";
        if (order.cart_items) {
            order.cart_items.forEach(item => {
                itemsHTML += `<li>${item.name} x ${item.quantity}</li>`;
            });
        }

        div.innerHTML = `
            <h3>Order ID: ${order.id}</h3>
            <p><b>Name:</b> ${order.customer_name}</p>
            <p><b>Address:</b> ${order.address}</p>
            <p><b>Payment:</b> ${order.payment_method}</p>
            <p><b>Total:</b> ₹${order.total_amount}</p>
            <p><b>Status:</b> ${order.status}</p>

            <details>
                <summary>View Items</summary>
                <ul>${itemsHTML}</ul>
            </details>

            <button onclick="markPaid('${order.id}')">Mark Paid</button>
            <button onclick="markPending('${order.id}')">Mark Pending</button>
            <button onclick="deleteOrder('${order.id}')">Delete</button>
        `;

        container.appendChild(div);
    });
}

/* ✅ UPDATE STATUS */
function markPaid(id) {
    db.ref("orders/" + id).update({ status: "paid" });
}

function markPending(id) {
    db.ref("orders/" + id).update({ status: "pending" });
}

/* ❌ DELETE */
function deleteOrder(id) {
    if (confirm("Delete order?")) {
        db.ref("orders/" + id).remove();
    }
}
</script>

</body>
</html>
